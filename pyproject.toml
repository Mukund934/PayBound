[project]
name = "paybound"
version = "0.1.0"
description = "Bounded authority for autonomous commerce — a runtime for the return leg of agentic commerce."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
seed = [
    "playwright>=1.45",
]

[project.scripts]
pb = "paybound.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paybound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "live: hits the real Razorpay API; requires RZP_KEY_ID/RZP_KEY_SECRET. Deselected by default.",
    "slow: takes more than a few seconds.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The overclaiming scan must match REAL curly quotes as they appear in markdown,
# so the ambiguous characters are the point rather than a typo. Scoped to this
# one file so the rule keeps protecting everything else.
"tests/regression/test_no_overclaiming.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
